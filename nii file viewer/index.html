<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standalone NIfTI (.nii / .nii.gz) Viewer</title>
    <!-- External pako 2.1.0 for Gzip decompression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #00adb5;
            --accent-hover: #008b92;
            --text-color: #eeeeee;
            --border-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #333333;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: #444444;
        }

        .btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #sidebar {
            width: 280px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-sizing: border-box;
            z-index: 5;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            color: #aaa;
        }

        .val-display {
            float: right;
            color: var(--accent-color);
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent-color);
        }

        select {
            background: #2a2a2a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
        }

        #viewport-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #555555; /* Neutral mid-gray display area */
            position: relative;
            user-select: none;
            overflow: hidden;
            cursor: grab;
        }

        #viewport-container:active {
            cursor: grabbing;
        }

        #canvas-wrapper {
            position: absolute;
            transform-origin: center center;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #222222; /* Canvas boundary highlight */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            image-rendering: pixelated;
            display: block;
        }

        #info-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            font-family: monospace;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 12px;
            border-radius: 4px;
            pointer-events: none;
            line-height: 1.4;
            z-index: 4;
        }

        #controls-hint {
            position: absolute;
            bottom: 15px;
            left: 15px;
            font-family: monospace;
            font-size: 11px;
            color: #ccc;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 4;
        }

        #loading {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            color: var(--accent-color);
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <h1>NIfTI Slice Viewer</h1>
        <div class="btn-wrapper">
            <button class="btn">Open NIfTI File (.nii / .nii.gz)</button>
            <input type="file" id="file-input" accept=".nii,.gz">
        </div>
    </header>

    <main>
        <div id="sidebar">
            <div class="control-group">
                <label for="view-orient">Orientation</label>
                <select id="view-orient">
                    <option value="axial">Axial (Z)</option>
                    <option value="coronal">Coronal (Y)</option>
                    <option value="sagittal">Sagittal (X)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="slice-range">Slice <span id="slice-val" class="val-display">0 / 0</span></label>
                <input type="range" id="slice-range" min="0" max="0" value="0" disabled>
            </div>

            <div class="control-group">
                <label for="window-width">Contrast <span id="ww-val" class="val-display">400</span></label>
                <input type="range" id="window-width" min="1" max="2000" value="400">
            </div>

            <div class="control-group">
                <label for="window-center">Brightness <span id="wc-val" class="val-display">40</span></label>
                <input type="range" id="window-center" min="-1000" max="1000" value="40">
            </div>

            <div class="control-group">
                <button id="btn-normalize" class="btn btn-secondary" disabled>Normalize Image Data</button>
            </div>
            
            <div class="control-group">
                <button id="btn-reset-zoom" class="btn btn-secondary">Reset Zoom & Pan</button>
            </div>
        </div>

        <div id="viewport-container">
            <div id="loading">Decompressing & Parsing File...</div>
            <div id="info-overlay">Select a .nii or .nii.gz file to render.</div>
            <div id="controls-hint">Scroll: Zoom | Shift + Scroll: Change Slice | Drag: Pan | Double Click: Reset View</div>
            
            <div id="canvas-wrapper">
                <canvas id="viewer-canvas"></canvas>
            </div>
        </div>
    </main>

    <script>
        class NiftiParser {
            static isGzip(buffer) {
                const u8 = new Uint8Array(buffer, 0, 2);
                return u8[0] === 0x1f && u8[1] === 0x8b;
            }

            static parse(arrayBuffer) {
                if (NiftiParser.isGzip(arrayBuffer)) {
                    if (typeof pako !== 'undefined') {
                        const decompressed = pako.ungzip(new Uint8Array(arrayBuffer));
                        arrayBuffer = decompressed.buffer;
                    } else {
                        throw new Error("Gzip decompressor unavailable.");
                    }
                }

                const view = new DataView(arrayBuffer);
                let littleEndian = true;

                let sizeof_hdr = view.getInt32(0, true);
                if (sizeof_hdr !== 348) {
                    sizeof_hdr = view.getInt32(0, false);
                    if (sizeof_hdr === 348) {
                        littleEndian = false;
                    } else {
                        throw new Error("Invalid NIfTI-1 header size.");
                    }
                }

                const dims = [];
                for (let i = 0; i < 8; i++) {
                    dims.push(view.getInt16(40 + (i * 2), littleEndian));
                }

                const datatype = view.getInt16(70, littleEndian);
                const bitpix = view.getInt16(72, littleEndian);
                const vox_offset = view.getFloat32(108, littleEndian);
                const scl_slope = view.getFloat32(112, littleEndian);
                const scl_inter = view.getFloat32(116, littleEndian);

                const offset = Math.floor(vox_offset);
                const numPixels = dims[1] * dims[2] * dims[3];

                let typedArray;
                if (datatype === 2) {
                    typedArray = new Uint8Array(arrayBuffer, offset, numPixels);
                } else if (datatype === 4) {
                    typedArray = new Int16Array(numPixels);
                    for (let i = 0; i < numPixels; i++) typedArray[i] = view.getInt16(offset + i * 2, littleEndian);
                } else if (datatype === 512) {
                    typedArray = new Uint16Array(numPixels);
                    for (let i = 0; i < numPixels; i++) typedArray[i] = view.getUint16(offset + i * 2, littleEndian);
                } else if (datatype === 8) {
                    typedArray = new Int32Array(numPixels);
                    for (let i = 0; i < numPixels; i++) typedArray[i] = view.getInt32(offset + i * 4, littleEndian);
                } else if (datatype === 16) {
                    typedArray = new Float32Array(numPixels);
                    for (let i = 0; i < numPixels; i++) typedArray[i] = view.getFloat32(offset + i * 4, littleEndian);
                } else if (datatype === 64) {
                    typedArray = new Float64Array(numPixels);
                    for (let i = 0; i < numPixels; i++) typedArray[i] = view.getFloat64(offset + i * 8, littleEndian);
                } else {
                    typedArray = new Uint8Array(arrayBuffer, offset, Math.min(numPixels * (bitpix / 8), arrayBuffer.byteLength - offset));
                }

                return {
                    header: {
                        dims: dims,
                        scl_slope: isNaN(scl_slope) || scl_slope === 0 ? 1 : scl_slope,
                        scl_inter: isNaN(scl_inter) ? 0 : scl_inter
                    },
                    data: typedArray
                };
            }
        }

        // State Variables
        let niftiHeader = null;
        let niftiTypedData = null;
        let dimensions = [0, 0, 0];
        
        let currentPlane = 'axial';
        let currentSlice = 0;
        let windowWidth = 400;
        let windowCenter = 40;

        // Zoom & Pan Variables
        let zoomLevel = 1.0;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        // Elements
        const fileInput = document.getElementById('file-input');
        const canvas = document.getElementById('viewer-canvas');
        const canvasWrapper = document.getElementById('canvas-wrapper');
        const viewportContainer = document.getElementById('viewport-container');
        const ctx = canvas.getContext('2d');
        const sliceRange = document.getElementById('slice-range');
        const sliceVal = document.getElementById('slice-val');
        const viewOrient = document.getElementById('view-orient');
        const wwRange = document.getElementById('window-width');
        const wcRange = document.getElementById('window-center');
        const wwVal = document.getElementById('ww-val');
        const wcVal = document.getElementById('wc-val');
        const infoOverlay = document.getElementById('info-overlay');
        const loading = document.getElementById('loading');
        const btnNormalize = document.getElementById('btn-normalize');
        const btnResetZoom = document.getElementById('btn-reset-zoom');

        fileInput.addEventListener('change', (evt) => {
            const files = evt.target.files;
            if (files.length === 0) return;
            
            loading.style.display = 'flex';

            setTimeout(() => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = NiftiParser.parse(e.target.result);
                        niftiHeader = parsed.header;
                        niftiTypedData = parsed.data;
                        dimensions = [niftiHeader.dims[1], niftiHeader.dims[2], niftiHeader.dims[3]];

                        btnNormalize.disabled = false;
                        setupSliders();
                        resetZoomPan();
                        updateView();
                    } catch (err) {
                        alert("Error parsing file: " + err.message);
                    } finally {
                        loading.style.display = 'none';
                    }
                };
                reader.readAsArrayBuffer(files[0]);
            }, 50);
        });

        function setupSliders() {
            let minVal = Infinity, maxVal = -Infinity;
            const step = Math.max(1, Math.floor(niftiTypedData.length / 10000));
            
            for (let i = 0; i < niftiTypedData.length; i += step) {
                let val = niftiTypedData[i];
                if (val < minVal) minVal = val;
                if (val > maxVal) maxVal = val;
            }

            const range = maxVal - minVal;
            wwRange.min = 1;
            wwRange.max = range || 1000;
            wwRange.value = range ? range / 2 : 400;
            windowWidth = parseFloat(wwRange.value);

            wcRange.min = minVal;
            wcRange.max = maxVal;
            wcRange.value = (maxVal + minVal) / 2;
            windowCenter = parseFloat(wcRange.value);

            wwVal.innerText = Math.round(windowWidth);
            wcVal.innerText = Math.round(windowCenter);

            sliceRange.disabled = false;
            updatePlaneBounds();
        }

        function normalizeImageData() {
            if (!niftiTypedData) return;

            // Subsample to find 1st and 99th percentile for robust normalization
            const sampleSize = 20000;
            const samples = new Float32Array(Math.min(sampleSize, niftiTypedData.length));
            const step = Math.max(1, Math.floor(niftiTypedData.length / samples.length));
            
            for (let i = 0; i < samples.length; i++) {
                samples[i] = niftiTypedData[i * step] * niftiHeader.scl_slope + niftiHeader.scl_inter;
            }
            
            samples.sort();

            const p1 = samples[Math.floor(samples.length * 0.01)];
            const p99 = samples[Math.floor(samples.length * 0.99)];

            windowWidth = Math.max(1, p99 - p1);
            windowCenter = p1 + (windowWidth / 2);

            wwRange.value = windowWidth;
            wcRange.value = windowCenter;
            wwVal.innerText = Math.round(windowWidth);
            wcVal.innerText = Math.round(windowCenter);

            updateView();
        }

        function updatePlaneBounds() {
            let maxSlice = 0;
            if (currentPlane === 'axial') maxSlice = dimensions[2] - 1;
            if (currentPlane === 'coronal') maxSlice = dimensions[1] - 1;
            if (currentPlane === 'sagittal') maxSlice = dimensions[0] - 1;

            sliceRange.max = Math.max(0, maxSlice);
            currentSlice = Math.floor(sliceRange.max / 2);
            sliceRange.value = currentSlice;
        }

        function applyTransform() {
            canvasWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
        }

        function resetZoomPan() {
            zoomLevel = 1.0;
            panX = 0;
            panY = 0;
            applyTransform();
        }

        function renderSlice() {
            if (!niftiTypedData) return;

            const [dimX, dimY, dimZ] = dimensions;
            let width, height;

            if (currentPlane === 'axial') {
                width = dimX; height = dimY;
            } else if (currentPlane === 'coronal') {
                width = dimX; height = dimZ;
            } else if (currentPlane === 'sagittal') {
                width = dimY; height = dimZ;
            }

            canvas.width = width;
            canvas.height = height;

            const imgData = ctx.createImageData(width, height);
            const data = imgData.data;

            const slope = niftiHeader.scl_slope;
            const intercept = niftiHeader.scl_inter;
            const minVisible = windowCenter - (windowWidth / 2);
            const maxVisible = windowCenter + (windowWidth / 2);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let rawVal = 0;

                    if (currentPlane === 'axial') {
                        let actualY = (dimY - 1 - y);
                        rawVal = niftiTypedData[currentSlice * (dimX * dimY) + actualY * dimX + x];
                    } else if (currentPlane === 'coronal') {
                        let actualZ = (dimZ - 1 - y);
                        rawVal = niftiTypedData[actualZ * (dimX * dimY) + currentSlice * dimX + x];
                    } else if (currentPlane === 'sagittal') {
                        let actualZ = (dimZ - 1 - y);
                        rawVal = niftiTypedData[actualZ * (dimX * dimY) + x * dimX + currentSlice];
                    }

                    let val = rawVal * slope + intercept;
                    let intensity = 0;

                    if (val <= minVisible) intensity = 0;
                    else if (val >= maxVisible) intensity = 255;
                    else intensity = ((val - minVisible) / windowWidth) * 255;

                    const idx = (y * width + x) * 4;
                    data[idx] = intensity;
                    data[idx + 1] = intensity;
                    data[idx + 2] = intensity;
                    data[idx + 3] = 255;
                }
            }

            ctx.putImageData(imgData, 0, 0);

            infoOverlay.innerHTML = `
                Dim: ${dimensions.join('x')}<br>
                Plane: ${currentPlane.toUpperCase()}<br>
                Slice: ${currentSlice + 1} / ${parseInt(sliceRange.max) + 1}<br>
                WL: ${Math.round(windowCenter)} WW: ${Math.round(windowWidth)}<br>
                Zoom: ${Math.round(zoomLevel * 100)}%
            `;
            sliceVal.innerText = `${currentSlice + 1} / ${parseInt(sliceRange.max) + 1}`;
        }

        function updateView() { renderSlice(); }

        // Event Listeners
        viewOrient.addEventListener('change', (e) => {
            currentPlane = e.target.value;
            updatePlaneBounds();
            resetZoomPan();
            updateView();
        });

        sliceRange.addEventListener('input', (e) => {
            currentSlice = parseInt(e.target.value);
            updateView();
        });

        wwRange.addEventListener('input', (e) => {
            windowWidth = parseFloat(e.target.value);
            wwVal.innerText = Math.round(windowWidth);
            updateView();
        });

        wcRange.addEventListener('input', (e) => {
            windowCenter = parseFloat(e.target.value);
            wcVal.innerText = Math.round(windowCenter);
            updateView();
        });

        btnNormalize.addEventListener('click', normalizeImageData);
        btnResetZoom.addEventListener('click', resetZoomPan);

        // Zoom & Slice Change via Wheel
        viewportContainer.addEventListener('wheel', (e) => {
            if (!niftiTypedData) return;
            e.preventDefault();

            if (e.shiftKey) {
                // Change slice when holding Shift key
                if (e.deltaY < 0) {
                    if (currentSlice < parseInt(sliceRange.max)) currentSlice++;
                } else {
                    if (currentSlice > 0) currentSlice--;
                }
                sliceRange.value = currentSlice;
                updateView();
            } else {
                // Zooming in/out
                const zoomFactor = 1.15;
                if (e.deltaY < 0) {
                    zoomLevel *= zoomFactor;
                } else {
                    zoomLevel /= zoomFactor;
                }
                zoomLevel = Math.max(0.2, Math.min(zoomLevel, 20.0)); // Clamp scale
                applyTransform();
                updateView();
            }
        }, { passive: false });

        // Pan Controls (Mouse Drag)
        viewportContainer.addEventListener('mousedown', (e) => {
            if (!niftiTypedData) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            applyTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        viewportContainer.addEventListener('dblclick', resetZoomPan);
    </script>
</body>
</html>
