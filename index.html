<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Project Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #ffffff;
            --accent-color: #4a90e2;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 30px;
            font-weight: 600;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        /* Card Container */
        .card {
            position: relative;
            height: 200px;
            border-radius: 12px;
            overflow: hidden; /* Keeps the zoomed image inside the card boundaries */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Pushes text to the bottom */
            padding: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* The Background Image Element */
        .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 1;
            transition: transform 0.5s ease;
        }

        /* Dark overlay so text is readable over the image */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 100%);
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        /* Card Content */
        .card-content {
            position: relative;
            z-index: 3; /* Sits above the overlay and image */
            color: var(--text-color);
        }

        .card h3 {
            margin: 0 0 5px 0;
            font-size: 1.4rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .card p {
            margin: 0;
            font-size: 0.9rem;
            opacity: 0.85;
        }

        /* HOVER EFFECTS */
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
        }

        /* Zooms the background image slightly on hover */
        .card:hover .card-bg {
            transform: scale(1.1);
        }

        /* Brightens the overlay slightly on hover */
        .card:hover::before {
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 100%);
        }
    </style>
</head>
<body>

    <h1>Select a Tool</h1>

    <div class="grid-container" id="cardGrid"></div>

    <script>
        // 1. YOUR FOLDERS LIST
        const folders = [
            "file to base64",
            "rgb ColorPicker",
        ];

        // Helper to clean up titles
        function formatTitle(folderName) {
            return folderName
                .replace(/[-_]/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase());
        }

        const gridContainer = document.getElementById('cardGrid');

        folders.forEach((folder, index) => {
            const card = document.createElement('a');
            card.href = `${folder}/index.html`;
            card.className = 'card';

            const displayTitle = formatTitle(folder);

            /* 2. DYNAMIC BACKGROUND IMAGES
               Using Unsplash Source. The `sig=${index}` forces a different random image 
               for every single card based on its position in the list.
            */
            const imageUrl = `https://picsum.photos/600/400?sig=${index}`;

            card.innerHTML = `
                <div class="card-bg" style="background-image: url('${imageUrl}');"></div>
                <div class="card-content">
                    <h3>${displayTitle}</h3>
                </div>
            `;

            gridContainer.appendChild(card);
        });
    </script>
</body>
</html>
